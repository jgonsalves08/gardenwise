[theme]
base = "light"
primaryColor = "#2F6B3F"
backgroundColor = "#F3F2E8"
secondaryBackgroundColor = "#EEF6EC"
textColor = "#1E2A22"
font = "sans serif"

[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"   # hides Deploy and developer options for visitors
